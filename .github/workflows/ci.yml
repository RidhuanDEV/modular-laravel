name: Laravel native verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laravel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo_mysql,pdo_pgsql,tokenizer,xml,zip,intl
          tools: composer:2.9.8
          coverage: none
      - name: Keep native diagnostics in runner temporary storage
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, ['TMPDIR','TMP','TEMP'].map(key => key+'='+process.env.RUNNER_TEMP).join('\n')+'\n')"
      - run: composer install --no-interaction --prefer-dist
      - run: composer build
      - run: node scripts/verify.mjs --stage native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: native-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/laravel-*-logs-*/
          retention-days: 7
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo_mysql,pdo_pgsql,tokenizer,xml,zip,intl
          tools: composer:2.9.8
          coverage: none
      - name: Keep native diagnostics in runner temporary storage
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, ['TMPDIR','TMP','TEMP'].map(key => key+'='+process.env.RUNNER_TEMP).join('\n')+'\n')"
      - run: composer install --no-interaction --prefer-dist
      - run: node scripts/build.mjs
      - run: node scripts/verify.mjs --stage integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: provider-diagnostics
          path: |
            ${{ runner.temp }}/laravel-build-*/
            ${{ runner.temp }}/laravel-integration-logs-*/
          retention-days: 7
